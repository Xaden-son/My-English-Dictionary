name: Update word count

on:
  push:
    branches: [main]
    paths:
      - "[0-9][0-9]-*.md"
      - "scripts/update_word_count.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: word-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README counter
        run: python scripts/update_word_count.py

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update word count"
          git pull --rebase
          git push
